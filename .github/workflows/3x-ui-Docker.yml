name: 3x-ui-Docker
on:
  repository_dispatch:
  workflow_dispatch:
    inputs:
      version_tag:
        description: 'Official version tag (vX.Y.Z or X.Y.Z); leave blank for latest release'
        required: false
        default: ''
        type: string

permissions:
  contents: write

# Never interrupt a push/export/release halfway through.
concurrency:
  group: 3x-ui-docker-publish
  cancel-in-progress: false

env:
  repo_url: https://github.com/MHSanaei/3x-ui.git
  repo_release: latest
  docker-repo: bigbugcc/3x-ui
  platforms: linux/386,linux/amd64,linux/arm64/v8,linux/arm/v7,linux/arm/v6

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 90
    steps:
      - name: Checkout ActionBot
        uses: actions/checkout@v7.0.1

      - name: Resolve official version
        id: version
        env:
          VERSION_TAG: ${{ inputs.version_tag || github.event.client_payload.version_tag || '' }}
          GH_TOKEN: ${{ github.token }}
        run: python3 bin/3x-ui/resolve_version.py

      - name: Checkout official source
        uses: actions/checkout@v7.0.1
        with:
          repository: MHSanaei/3x-ui
          ref: ${{ steps.version.outputs.sha }}
          path: workdir
          fetch-depth: 1
          submodules: recursive
          persist-credentials: false

      - name: Resolve source identity
        id: source
        working-directory: workdir
        env:
          SOURCE_VERSION: ${{ steps.version.outputs.tag }}
          EXPECTED_SHA: ${{ steps.version.outputs.sha }}
        run: |
          set -euo pipefail
          sha=$(git rev-parse HEAD)
          test "$sha" = "$EXPECTED_SHA"
          version=$SOURCE_VERSION
          echo "sha=$sha" >> "$GITHUB_OUTPUT"
          echo "version=$version" >> "$GITHUB_OUTPUT"
          echo "source_date=$(date -u -d "$(git show -s --format=%cI HEAD)" +%Y-%m-%dT%H:%M:%SZ)" >> "$GITHUB_OUTPUT"
          echo "created=$(date -u +%Y-%m-%dT%H:%M:%SZ)" >> "$GITHUB_OUTPUT"
          echo "release_tag=3x-ui-${version}-${GITHUB_RUN_ID}-${GITHUB_RUN_ATTEMPT}" >> "$GITHUB_OUTPUT"

      - name: Configure official build
        env:
          SOURCE_SHA: ${{ steps.source.outputs.sha }}
          SOURCE_DATE: ${{ steps.source.outputs.source_date }}
          STABLE_BUILD: 'true'
        run: bash bin/3x-ui/configure.sh workdir

      - name: Docker metadata
        id: meta
        uses: docker/metadata-action@v6
        with:
          images: ${{ env.docker-repo }}
          flavor: latest=false
          tags: |
            type=raw,value=${{ steps.source.outputs.version }}
            type=semver,pattern={{version}},value=${{ steps.source.outputs.version }}
            type=raw,value=latest,enable=${{ steps.version.outputs.latest == 'true' }}
          labels: |
            org.opencontainers.image.source=https://github.com/MHSanaei/3x-ui
            org.opencontainers.image.revision=${{ steps.source.outputs.sha }}
            org.opencontainers.image.version=${{ steps.source.outputs.version }}
            org.opencontainers.image.created=${{ steps.source.outputs.created }}
            org.opencontainers.image.url=https://github.com/MHSanaei/3x-ui/commit/${{ steps.source.outputs.sha }}

      - name: Set up QEMU
        uses: docker/setup-qemu-action@v4.4.0
        with:
          platforms: amd64,arm64,arm,386
          # Pull the small binfmt image directly instead of restoring its archive.
          cache-image: false

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v4.4.1

      - name: Login to Docker Hub
        uses: docker/login-action@v4.6.0
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      - name: Build and push staging image
        id: docker
        uses: docker/build-push-action@v7.4.0
        with:
          context: ./workdir
          push: true
          pull: true
          platforms: ${{ env.platforms }}
          tags: ${{ env.docker-repo }}:build-${{ github.run_id }}-${{ github.run_attempt }}
          labels: ${{ steps.meta.outputs.labels }}
          provenance: mode=max
          sbom: true
          cache-from: type=gha,scope=3x-ui-docker
          cache-to: type=gha,scope=3x-ui-docker,mode=max
          # Refresh latest assets without invalidating compiler/frontend layers.
          no-cache-filters: resources

      - name: Export and verify offline images
        env:
          IMAGE_REPO: ${{ env.docker-repo }}
          IMAGE_DIGEST: ${{ steps.docker.outputs.digest }}
          IMAGE_VERSION: ${{ steps.source.outputs.version }}
          BUILD_METADATA: ${{ steps.docker.outputs.metadata }}
          SOURCE_SHA: ${{ steps.source.outputs.sha }}
          SOURCE_REF: ${{ steps.version.outputs.tag }}
          SOURCE_DATE: ${{ steps.source.outputs.source_date }}
          BUILD_DATE: ${{ steps.source.outputs.created }}
        run: |
          set -euo pipefail
          mkdir -p artifacts
          printf '%s\n' "$BUILD_METADATA" > artifacts/build-metadata.json
          jq -n --arg repository "$IMAGE_REPO" --arg digest "$IMAGE_DIGEST" \
            --arg source_sha "$SOURCE_SHA" --arg source_ref "$SOURCE_REF" \
            --arg version "$IMAGE_VERSION" --arg source_date "$SOURCE_DATE" --arg created "$BUILD_DATE" \
            '{repository:$repository,digest:$digest,source_sha:$source_sha,source_ref:$source_ref,version:$version,source_date:$source_date,created:$created}' \
            > artifacts/source.json
          docker buildx imagetools inspect --raw "${IMAGE_REPO}@${IMAGE_DIGEST}" > artifacts/manifest.json
          for target in 386 amd64 arm64 armv7 armv6; do
            arch=$target
            variant=''
            binary_arch=$target
            case "$target" in
              arm64) variant=v8 ;;
              armv7) arch=arm; variant=v7; binary_arch=arm32 ;;
              armv6) arch=arm; variant=v6; binary_arch=arm32 ;;
            esac
            platform="linux/$arch${variant:+/$variant}"
            # Resolve a single platform manifest; exclude SBOM/provenance manifests.
            child_digest=$(jq -er --arg arch "$arch" --arg variant "$variant" '
              [.manifests[] | select(.platform.os == "linux" and .platform.architecture == $arch
                and (($variant == "") or (.platform.variant == $variant)
                  or ($arch == "arm64" and (.platform.variant // "") == ""))) | .digest]
              | if length == 1 then .[0] else error("Expected one platform manifest") end
              ' artifacts/manifest.json)
            image="${IMAGE_REPO}@${child_digest}"
            docker pull --platform "$platform" "$image"
            local_tag="${IMAGE_REPO}:${IMAGE_VERSION}-${target}"
            docker tag "$image" "$local_tag"
            test "$(docker image inspect --format '{{.Architecture}}' "$local_tag")" = "$arch"
            cid=$(docker create --platform "$platform" --entrypoint /bin/sh "$local_tag")
            docker cp "$cid:/app/x-ui" "artifacts/x-ui-$target"
            docker cp "$cid:/app/bin/xray-linux-$binary_arch" "artifacts/xray-$target"
            if docker cp "$cid:/app/bin/mtg-linux-$binary_arch" "artifacts/mtg-$target"; then
              file "artifacts/mtg-$target"
            elif grep -q 'mtg-linux-' workdir/DockerInit.sh; then
              docker rm "$cid"
              exit 1
            fi
            docker rm "$cid"
            file "artifacts/xray-$target"
            case "$arch" in
              386) machine='Intel 80386' ;;
              amd64) machine='Advanced Micro Devices X86-64' ;;
              arm64) machine='AArch64' ;;
              arm) machine='ARM' ;;
            esac
            for binary in "artifacts/x-ui-$target" "artifacts/xray-$target" "artifacts/mtg-$target"; do
              if [ -f "$binary" ]; then
                readelf -h "$binary" | grep -F "$machine"
                rm "$binary"
              fi
            done
            docker save "$local_tag" | gzip > "artifacts/3x-ui-${target}-${IMAGE_VERSION}.tar.gz"
            # Removing the only tag also removes the digest reference.
            docker image rm "$local_tag"
          done
          (cd artifacts && sha256sum *.tar.gz *.json > SHA256SUMS)

      - name: Publish verified image tags
        env:
          IMAGE_REPO: ${{ env.docker-repo }}
          IMAGE_DIGEST: ${{ steps.docker.outputs.digest }}
          PUBLISH_TAGS: ${{ steps.meta.outputs.tags }}
        run: bash bin/3x-ui/publish.sh artifacts

      - name: Create release
        uses: softprops/action-gh-release@v3.0.3
        with:
          tag_name: ${{ steps.source.outputs.release_tag }}
          target_commitish: ${{ github.sha }}
          name: 3x-ui Docker - ${{ steps.source.outputs.version }}
          prerelease: false
          make_latest: ${{ steps.version.outputs.latest == 'true' && 'true' || 'false' }}
          fail_on_unmatched_files: true
          body: |
            Source: https://github.com/MHSanaei/3x-ui/commit/${{ steps.source.outputs.sha }}
            Source tag: `${{ steps.version.outputs.tag }}`
            Source commit time: `${{ steps.source.outputs.source_date }}`
            Workflow build time: `${{ steps.source.outputs.created }}`
            Image: `${{ env.docker-repo }}:${{ steps.source.outputs.version }}`
            Digest: `${{ steps.docker.outputs.digest }}`
            Platforms: `${{ env.platforms }}`

            Offline import: `gzip -dc 3x-ui-ARCH-${{ steps.source.outputs.version }}.tar.gz | docker load`
            Offline image tag: `${{ env.docker-repo }}:${{ steps.source.outputs.version }}-ARCH`
            Verify downloads with `sha256sum -c SHA256SUMS`.
          files: |
            artifacts/3x-ui-386-${{ steps.source.outputs.version }}.tar.gz
            artifacts/3x-ui-amd64-${{ steps.source.outputs.version }}.tar.gz
            artifacts/3x-ui-arm64-${{ steps.source.outputs.version }}.tar.gz
            artifacts/3x-ui-armv7-${{ steps.source.outputs.version }}.tar.gz
            artifacts/3x-ui-armv6-${{ steps.source.outputs.version }}.tar.gz
            artifacts/build-metadata.json
            artifacts/source.json
            artifacts/manifest.json
            artifacts/SHA256SUMS
