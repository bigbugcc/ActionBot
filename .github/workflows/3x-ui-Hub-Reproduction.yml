name: 3x-ui-Hub-Reproduction
on:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: 3x-ui-docker-publish
  cancel-in-progress: false

jobs:
  reproduce:
    runs-on: ubuntu-26.04
    timeout-minutes: 7
    steps:
      - name: Checkout
        uses: actions/checkout@v7.0.1
        with:
          persist-credentials: false

      - name: Create one temporary tag, capture first response, and clean up
        id: probe
        env:
          DOCKERHUB_USERNAME: ${{ secrets.DOCKERHUB_USERNAME }}
          DOCKERHUB_TOKEN: ${{ secrets.DOCKERHUB_TOKEN }}
        run: |
          python3 -u -B - <<'PY'
          import base64
          import hashlib
          import importlib.util
          import io
          import json
          import os
          from pathlib import Path
          import re
          import time
          from urllib.error import HTTPError
          from urllib.parse import urlencode, urlparse
          from urllib.request import Request, build_opener

          spec = importlib.util.spec_from_file_location("hub_cleanup", "bin/3x-ui/cleanup_tags.py")
          cleanup = importlib.util.module_from_spec(spec)
          spec.loader.exec_module(cleanup)
          run_id, attempt = os.environ["GITHUB_RUN_ID"], os.environ["GITHUB_RUN_ATTEMPT"]
          assert re.fullmatch(r"[0-9]+", run_id) and re.fullmatch(r"[0-9]+", attempt)
          repository, source = "bigbugcc/3x-ui", "v3.11.0"
          temporary = "diag-hub-" + run_id + "-" + attempt
          hub_path = "/v2/namespaces/bigbugcc/repositories/3x-ui/tags/"
          registry_path = "/v2/bigbugcc/3x-ui/manifests/"
          scope_query = urlencode({"service": "registry.docker.io", "scope": "repository:" + repository + ":pull,push"})
          started = time.monotonic()
          deadline = started + 180
          requests = 0
          phase_requests = 0
          create_attempted = False
          expected_digest = None
          hub_token = registry_token = None
          baseline = None
          report = {"repository": repository, "source_tag": source, "temporary_tag": temporary,
                    "workflow_sha": os.environ["GITHUB_SHA"], "samples": [], "cleanup": {}}


          class MemoryResponse(io.BytesIO):
              def __init__(self, raw, status, headers):
                  super().__init__(raw)
                  self.status, self.headers = status, headers


          class SafeOpener:
              def __init__(self, pages=None):
                  self.opener = build_opener(cleanup.NoRedirect())
                  self.pages = pages

              def open(self, request, timeout=30):
                  global requests, phase_requests
                  parsed, method = urlparse(request.full_url), request.get_method()
                  allowed = False
                  if parsed.netloc == "hub.docker.com":
                      allowed = ((method == "POST" and parsed.path == "/v2/auth/token")
                                 or (method == "GET" and parsed.path.rstrip("/") in
                                     (hub_path.rstrip("/"), hub_path + source, hub_path + temporary))
                                 or (method == "DELETE" and create_attempted
                                     and parsed.path == hub_path + temporary + "/"))
                  elif parsed.netloc == "auth.docker.io":
                      allowed = method == "GET" and parsed.path == "/token" and parsed.query == scope_query
                  elif parsed.netloc == "registry-1.docker.io":
                      allowed = ((method in ("GET", "HEAD") and parsed.path in
                                  (registry_path + source, registry_path + temporary))
                                 or (method == "PUT" and create_attempted and parsed.path == registry_path + temporary))
                  if not allowed or parsed.scheme != "https":
                      raise ValueError("Request outside the approved experiment endpoints")
                  if time.monotonic() > deadline or phase_requests >= 60:
                      raise ValueError("Experiment request/time budget exceeded")
                  if self.pages is not None and len(self.pages) >= 10:
                      raise ValueError("Experiment page limit exceeded")
                  requests += 1
                  phase_requests += 1
                  with self.opener.open(request, timeout=8) as response:
                      raw = response.read(5_000_001)
                      status, headers = response.status, dict(response.headers.items())
                  if len(raw) > 5_000_000:
                      raise ValueError("Response too large")
                  if (self.pages is not None and method == "GET" and parsed.netloc == "hub.docker.com"
                          and parsed.path.rstrip("/") == hub_path.rstrip("/")):
                      body = json.loads(raw)
                      safe_headers = {key: value for key, value in headers.items() if key.lower() in
                                      ("date", "age", "cache-control", "cf-cache-status", "x-cache", "x-trace-id")}
                      self.pages.append({"url": request.full_url, "seconds": round(time.monotonic() - started, 6),
                                         "http_status": status, "headers": safe_headers,
                                         "raw_body_utf8": raw.decode("utf-8"), "body": body})
                  return MemoryResponse(raw, status, headers)


          class ProbeClient(cleanup.HubClient):
              def __init__(self, token, page_size):
                  super().__init__(repository)
                  self.token, self.page_size, self.pages = token, page_size, []
                  self.opener = SafeOpener(self.pages)

              def request(self, method, path, data=None):
                  if method == "GET" and path == self.tags_path + "?page_size=100":
                      path = self.tags_path + "?page_size=" + str(self.page_size)
                  return super().request(method, path, data)


          def raw_request(method, url, headers, data=None):
              with SafeOpener().open(Request(url, headers=headers, data=data, method=method)) as response:
                  return response.status, response.headers, response.read()


          def hub_headers():
              return {"Accept": "application/json", "User-Agent": "ActionBot-3x-ui", "Authorization": "Bearer " + hub_token}


          def registry_headers():
              return {"Authorization": "Bearer " + registry_token, "User-Agent": "ActionBot-Hub-Reproduction",
                      "Accept": "application/vnd.oci.image.index.v1+json, application/vnd.docker.distribution.manifest.list.v2+json"}


          def snapshot(label, token, page_size=100):
              client = ProbeClient(token, page_size)
              error = None
              try:
                  client.list_tags()
              except (ValueError, OSError, KeyError, TypeError) as failure:
                  error = {"type": type(failure).__name__, "message": str(failure)[:500]}
              rows = [row for page in client.pages for row in page["body"].get("results", [])]
              tags = {row["name"]: row.get("digest") for row in rows if isinstance(row, dict) and isinstance(row.get("name"), str)}
              summary = {"label": label, "page_size": page_size, "production_listing_passed": error is None,
                         "error": error, "counts": [page["body"].get("count") for page in client.pages],
                         "page_records": [len(page["body"].get("results", [])) for page in client.pages],
                         "unique_tags": len(tags), "contains_temporary": temporary in tags,
                         "seconds": round(time.monotonic() - started, 6)}
              report["samples"].append({**summary, "page_data": client.pages})
              print(json.dumps(summary), flush=True)
              return summary, tags


          def absent(method, url, headers):
              try:
                  raw_request(method, url, headers)
                  return False
              except HTTPError as error:
                  if error.code == 404:
                      return True
                  raise


          try:
              auth = cleanup.HubClient(repository)
              auth.opener = SafeOpener()
              auth.login(os.environ["DOCKERHUB_USERNAME"], os.environ["DOCKERHUB_TOKEN"])
              hub_token = auth.token
              summary, baseline = snapshot("before-create-authenticated", hub_token)
              if not summary["production_listing_passed"]:
                  raise ValueError("Baseline already inconsistent; no tag will be created")
              expected_digest = baseline.get(source)
              if not isinstance(expected_digest, str) or not re.fullmatch(r"sha256:[0-9a-f]{64}", expected_digest):
                  raise ValueError("Source digest unavailable; no tag will be created")
              report["expected_digest"] = expected_digest
              credentials = base64.b64encode((os.environ["DOCKERHUB_USERNAME"] + ":" + os.environ["DOCKERHUB_TOKEN"]).encode()).decode()
              _, _, raw = raw_request("GET", "https://auth.docker.io/token?" + scope_query,
                                      {"Authorization": "Basic " + credentials})
              token_response = json.loads(raw)
              registry_token = token_response.get("token") or token_response.get("access_token")
              if not isinstance(registry_token, str) or not registry_token:
                  raise ValueError("Registry token unavailable; no tag will be created")
              print("::add-mask::" + registry_token)
              if not absent("GET", cleanup.HUB + hub_path + temporary + "/", hub_headers()):
                  raise ValueError("Temporary tag already exists in Hub; refusing to use it")
              if not absent("HEAD", "https://registry-1.docker.io" + registry_path + temporary, registry_headers()):
                  raise ValueError("Temporary tag already exists in Registry; refusing to use it")
              _, source_headers, manifest = raw_request("GET", "https://registry-1.docker.io" + registry_path + source, registry_headers())
              if "sha256:" + hashlib.sha256(manifest).hexdigest() != expected_digest:
                  raise ValueError("Source digest changed; no tag will be created")
              media_type = json.loads(manifest).get("mediaType")
              if media_type not in ("application/vnd.oci.image.index.v1+json", "application/vnd.docker.distribution.manifest.list.v2+json"):
                  raise ValueError("Expected an unchanged multi-platform index")
              create_attempted = True
              report["create_attempted"] = True
              put_headers = {**registry_headers(), "Content-Type": media_type}
              status, _, _ = raw_request("PUT", "https://registry-1.docker.io" + registry_path + temporary, put_headers, manifest)
              if status != 201:
                  raise ValueError("Unexpected Registry tag creation status")
              report["created_seconds"] = round(time.monotonic() - started, 6)
              print(json.dumps({"event": "temporary-tag-created", "tag": temporary, "http_status": status}), flush=True)
              # The first production-style authenticated listing follows PUT immediately.
              snapshot("after-create-first-authenticated", hub_token)
              snapshot("after-create-authenticated-25", hub_token, 25)
              snapshot("after-create-anonymous", None)
              time.sleep(3)
              snapshot("after-create-later-authenticated", hub_token)
          except Exception as failure:
              report["experiment_error"] = {"type": type(failure).__name__, "message": str(failure)[:500]}
              print(json.dumps({"experiment_error": report["experiment_error"]}), flush=True)
          finally:
              # Sampling cannot consume the requests reserved for owned-tag cleanup.
              phase_requests = 0
              deadline = time.monotonic() + 90
              if create_attempted:
                  try:
                      for delay in (0, 1, 2, 4):
                          if delay:
                              time.sleep(delay)
                          registry_missing = absent("HEAD", "https://registry-1.docker.io" + registry_path + temporary, registry_headers())
                          if not registry_missing:
                              _, _, raw = raw_request("GET", "https://registry-1.docker.io" + registry_path + temporary, registry_headers())
                              if "sha256:" + hashlib.sha256(raw).hexdigest() != expected_digest:
                                  raise ValueError("Temporary tag digest changed; refusing deletion")
                          hub_missing = False
                          try:
                              _, _, raw = raw_request("GET", cleanup.HUB + hub_path + temporary + "/", hub_headers())
                              if json.loads(raw).get("digest") != expected_digest:
                                  raise ValueError("Hub temporary tag digest changed; refusing deletion")
                          except HTTPError as error:
                              if error.code != 404:
                                  raise
                              hub_missing = True
                          if not (registry_missing and hub_missing):
                              try:
                                  status, _, _ = raw_request("DELETE", cleanup.HUB + hub_path + temporary + "/", hub_headers())
                              except HTTPError as error:
                                  if error.code != 404:
                                      raise
                                  status = 404
                              report["cleanup"].setdefault("delete_http_statuses", []).append(status)
                          registry_missing = absent("HEAD", "https://registry-1.docker.io" + registry_path + temporary, registry_headers())
                          hub_missing = absent("GET", cleanup.HUB + hub_path + temporary + "/", hub_headers())
                          report["cleanup"].update({"registry_tag_absent": registry_missing, "hub_tag_absent": hub_missing})
                          if registry_missing and hub_missing:
                              break
                      _, final_tags = snapshot("after-cleanup-authenticated", hub_token)
                      report["cleanup"]["baseline_names_and_digests_restored"] = final_tags == baseline
                  except Exception as failure:
                      report["cleanup"]["error"] = {"type": type(failure).__name__, "message": str(failure)[:500]}
                  print(json.dumps({"cleanup": report["cleanup"]}), flush=True)
              else:
                  report["cleanup"]["no_create_attempted"] = True
              report["duration_seconds"], report["requests"] = round(time.monotonic() - started, 3), requests
              output = Path(os.environ["RUNNER_TEMP"]) / ("hub-reproduction-" + run_id + "-" + attempt + ".json")
              with output.open("x", encoding="utf-8") as stream:
                  with Path(os.environ["GITHUB_OUTPUT"]).open("a", encoding="utf-8") as outputs:
                      outputs.write("report=" + str(output) + "\n")
                  json.dump(report, stream, ensure_ascii=False, indent=2)
              with Path(os.environ["GITHUB_STEP_SUMMARY"]).open("a", encoding="utf-8") as summary_file:
                  summary_file.write("Temporary tag: \x60" + temporary + "\x60\n\n")
                  for sample in report["samples"]:
                      summary_file.write(f"- {sample['label']}: counts={sample['counts']}, records={sample['page_records']}, "
                                         f"passed={sample['production_listing_passed']}\n")
                  summary_file.write("\nCleanup: \x60" + json.dumps(report["cleanup"]) + "\x60\n")
              clean = report["cleanup"]
              if report.get("experiment_error") or (create_attempted and not (
                      clean.get("registry_tag_absent") and clean.get("hub_tag_absent")
                      and clean.get("baseline_names_and_digests_restored"))):
                  raise SystemExit(1)
          PY

      - name: Upload reproduction evidence
        if: always() && steps.probe.outputs.report != ''
        uses: actions/upload-artifact@v7
        with:
          name: hub-reproduction-${{ github.run_id }}-${{ github.run_attempt }}
          path: ${{ steps.probe.outputs.report }}
          retention-days: 1
          if-no-files-found: error

      - name: Remove local evidence file
        if: always() && steps.probe.outputs.report != ''
        env:
          REPORT_PATH: ${{ steps.probe.outputs.report }}
        run: |
          python3 -B - <<'PY'
          import os
          from pathlib import Path
          report = Path(os.environ["REPORT_PATH"]).resolve()
          expected = Path(os.environ["RUNNER_TEMP"]).resolve() / (
              "hub-reproduction-" + os.environ["GITHUB_RUN_ID"] + "-" + os.environ["GITHUB_RUN_ATTEMPT"] + ".json")
          assert report == expected
          report.unlink(missing_ok=True)
          assert not report.exists()
          print("Local reproduction report removed.")
          PY
