name: 3x-ui-Hub-Diagnostics
on:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: 3x-ui-hub-diagnostics
  cancel-in-progress: false

jobs:
  diagnose:
    runs-on: ubuntu-26.04
    timeout-minutes: 5
    steps:
      - name: Checkout
        uses: actions/checkout@v7.0.1
        with:
          persist-credentials: false

      - name: Compare anonymous and authenticated tag listings
        id: probe
        env:
          DOCKERHUB_USERNAME: ${{ secrets.DOCKERHUB_USERNAME }}
          DOCKERHUB_TOKEN: ${{ secrets.DOCKERHUB_TOKEN }}
        run: |
          python3 -u -B - <<'PY'
          import importlib.util
          import io
          import json
          import os
          from pathlib import Path
          import time
          from urllib.parse import urlparse

          spec = importlib.util.spec_from_file_location("hub_cleanup", "bin/3x-ui/cleanup_tags.py")
          cleanup = importlib.util.module_from_spec(spec)
          spec.loader.exec_module(cleanup)
          started = time.monotonic()
          request_count = 0
          repository = "bigbugcc/3x-ui"
          tags_path = "/v2/namespaces/bigbugcc/repositories/3x-ui/tags/"
          report = {"repository": repository, "workflow_sha": os.environ["GITHUB_SHA"], "samples": [], "comparisons": []}


          class RecordingOpener:
              def __init__(self, opener, pages):
                  self.opener = opener
                  self.pages = pages

              def open(self, request, timeout=30):
                  global request_count
                  parsed = urlparse(request.full_url)
                  method = request.get_method()
                  allowed = ((method == "GET" and parsed.path.rstrip("/") == tags_path.rstrip("/"))
                             or (method == "POST" and parsed.path == "/v2/auth/token"))
                  if not allowed or parsed.scheme != "https" or parsed.netloc != "hub.docker.com":
                      raise ValueError("Diagnostic request outside the allowed read/authentication endpoints")
                  if time.monotonic() - started > 180 or request_count >= 40 or len(self.pages) >= 10:
                      raise ValueError("Diagnostic request/page/time budget exceeded")
                  request_count += 1
                  with self.opener.open(request, timeout=10) as response:
                      raw = response.read(5_000_001)
                      headers = {name: response.headers.get(name) for name in
                                 ("Date", "Age", "Cache-Control", "CF-Cache-Status", "X-Cache", "X-Trace-ID")
                                 if response.headers.get(name)}
                      status = response.status
                  if len(raw) > 5_000_000:
                      raise ValueError("Diagnostic response too large")
                  if method == "GET":
                      page = json.loads(raw)
                      rows = page.get("results", []) if isinstance(page, dict) else []
                      self.pages.append({
                          "page": len(self.pages) + 1, "url": request.full_url,
                          "http_status": status, "headers": headers,
                          "count": page.get("count"), "next": page.get("next"),
                          "records": len(rows),
                          "tags": [{key: row.get(key) for key in
                                    ("name", "digest", "tag_status", "tag_last_pushed")}
                                   for row in rows if isinstance(row, dict)],
                      })
                  # Authentication response bytes stay in memory and are never recorded.
                  return io.BytesIO(raw)


          class ProbeClient(cleanup.HubClient):
              def __init__(self, token=None, page_size=100):
                  super().__init__(repository)
                  self.token = token
                  self.page_size = page_size
                  self.pages = []
                  self.opener = RecordingOpener(self.opener, self.pages)

              def request(self, method, path, data=None):
                  if method == "GET" and path == self.tags_path + "?page_size=100":
                      path = self.tags_path + "?page_size=" + str(self.page_size)
                  return super().request(method, path, data)


          try:
              authenticated = ProbeClient()
              # Reuse the production script's token exchange and add-mask behavior.
              authenticated.login(os.environ["DOCKERHUB_USERNAME"], os.environ["DOCKERHUB_TOKEN"])
              for round_number in (1, 2):
                  samples = {}
                  for page_size in (100, 25):
                      for mode in ("anonymous", "authenticated"):
                          client = ProbeClient(authenticated.token if mode == "authenticated" else None, page_size)
                          error = None
                          try:
                              client.list_tags()
                          except (ValueError, OSError, KeyError, TypeError) as failure:
                              error = {"type": type(failure).__name__, "message": str(failure)[:500]}
                          names = [row["name"] for page in client.pages for row in page["tags"]
                                   if isinstance(row.get("name"), str)]
                          summary = {
                              "round": round_number, "mode": mode, "page_size": page_size,
                              "production_listing_passed": error is None, "error": error,
                              "counts": [page["count"] for page in client.pages],
                              "page_records": [page["records"] for page in client.pages],
                              "pages": len(client.pages), "unique_tags": len(set(names)),
                              "duplicates": len(names) - len(set(names)),
                          }
                          print(json.dumps(summary), flush=True)
                          report["samples"].append({**summary, "page_data": client.pages})
                          samples[(mode, page_size)] = set(names)
                  for page_size in (100, 25):
                      anonymous = samples[("anonymous", page_size)]
                      signed_in = samples[("authenticated", page_size)]
                      comparison = {
                          "round": round_number, "page_size": page_size,
                          "anonymous_only": sorted(anonymous - signed_in),
                          "authenticated_only": sorted(signed_in - anonymous),
                      }
                      report["comparisons"].append(comparison)
                      print(json.dumps(comparison), flush=True)
                  if round_number == 1:
                      time.sleep(5)
          finally:
              report["duration_seconds"] = round(time.monotonic() - started, 3)
              report["requests"] = request_count
              output = Path(os.environ["RUNNER_TEMP"]) / (
                  "hub-tags-" + os.environ["GITHUB_RUN_ID"] + "-" + os.environ["GITHUB_RUN_ATTEMPT"] + ".json")
              with output.open("x", encoding="utf-8") as stream:
                  with Path(os.environ["GITHUB_OUTPUT"]).open("a", encoding="utf-8") as outputs:
                      outputs.write("report=" + str(output) + "\n")
                  json.dump(report, stream, ensure_ascii=False, indent=2)
              with Path(os.environ["GITHUB_STEP_SUMMARY"]).open("a", encoding="utf-8") as summary:
                  summary.write("Read-only Docker Hub diagnosis: no image publication or tag deletion.\n\n")
                  summary.write("| Round | Mode | Page size | Counts | Records | Listing passed |\n")
                  summary.write("| --- | --- | --- | --- | --- | --- |\n")
                  for sample in report["samples"]:
                      summary.write(f"| {sample['round']} | {sample['mode']} | {sample['page_size']} | "
                                    f"{sample['counts']} | {sample['page_records']} | "
                                    f"{sample['production_listing_passed']} |\n")
          PY

      - name: Upload diagnosis
        if: always() && steps.probe.outputs.report != ''
        uses: actions/upload-artifact@v7
        with:
          name: hub-tag-diagnostics-${{ github.run_id }}-${{ github.run_attempt }}
          path: ${{ steps.probe.outputs.report }}
          retention-days: 1
          if-no-files-found: error

      - name: Remove local diagnostic report
        if: always() && steps.probe.outputs.report != ''
        env:
          REPORT_PATH: ${{ steps.probe.outputs.report }}
        run: |
          python3 -B - <<'PY'
          import os
          from pathlib import Path
          report = Path(os.environ["REPORT_PATH"]).resolve()
          expected = Path(os.environ["RUNNER_TEMP"]).resolve() / (
              "hub-tags-" + os.environ["GITHUB_RUN_ID"] + "-" + os.environ["GITHUB_RUN_ATTEMPT"] + ".json")
          assert report == expected
          report.unlink(missing_ok=True)
          assert not report.exists()
          print("Local diagnostic report removed; uploaded evidence retained for one day.")
          PY
