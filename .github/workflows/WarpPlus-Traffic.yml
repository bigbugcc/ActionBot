name: WarpPlus-Traffic

on:
  workflow_dispatch:

env:
  repo_url: ''
  force_active: 2

jobs:
  sync:
    runs-on: ubuntu-latest
    steps:
      - name: 'Checking'
        uses: actions/checkout@v7.0.1

      - name: 'Setting Python'
        uses: actions/setup-python@v7.0.0
        with:
          python-version: '3.x'
          check-latest: true

      - name: 'Getting WARP+ Traffic'
        env:
          DEVICEID: ${{ secrets.WARP_DEVICEID }}      
        run: python ./bin/warp/warp.py